---
- name: Deploy Todo App
  hosts: web
  become: yes

  vars:
    app_dir: /home/ubuntu/application

  tasks:

  - name: Install system dependencies
    apt:
      name:
        - python3
        - python3-pip
        - python3-venv
        - git
      update_cache: yes

  - name: Remove old application directory
    file:
      path: "{{ app_dir }}"
      state: absent

  - name: Create application directory
    file:
      path: "{{ app_dir }}"
      state: directory
      owner: ubuntu
      group: ubuntu
      mode: '0755'

  - name: Clone repository
    git:
      repo: https://github.com/Pavithrap7/to_do_app.git
      dest: "{{ app_dir }}"
      version: master
      force: yes

  - name: Create Python virtual environment
    command: python3 -m venv venv
    args:
      chdir: "{{ app_dir }}"

  - name: Install Python requirements
    pip:
      requirements: "{{ app_dir }}/requirements.txt"
      virtualenv: "{{ app_dir }}/venv"

  - name: Stop existing FastAPI process
    shell: pkill -f main.py || true

  - name: Start FastAPI application
    shell: |
      nohup env FIREBASE_KEY_BASE64='{{ firebase_key }}' \
      {{ app_dir }}/venv/bin/uvicorn app.main:app \
      --host 0.0.0.0 \
      --port 8000 > app.log 2>&1 &
    args:
      chdir: "{{ app_dir }}"
