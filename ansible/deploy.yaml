---
- name: Deploy FastAPI Todo App
  hosts: web
  become: yes
  vars:
    app_dir: /home/ubuntu/application

  tasks:

  - name: Ensure application directory exists
    file:
      path: "{{ app_dir }}"
      state: directory
      owner: ubuntu
      group: ubuntu
      mode: '0755'

  - name: Copy tested code from Jenkins workspace
    synchronize:
      src: "{{ playbook_dir }}/../"  # Jenkins workspace root
      dest: "{{ app_dir }}"
      rsync_opts:
        - "--exclude=.git"
        - "--exclude=ansible"
        - "--exclude=venv"

  - name: Create Python virtualenv
    command: python3 -m venv venv
    args:
      chdir: "{{ app_dir }}"

  - name: Install requirements
    pip:
      requirements: "{{ app_dir }}/requirements.txt"
      virtualenv: "{{ app_dir }}/venv"

  - name: Kill old FastAPI process
    shell: pkill -f uvicorn || true

  - name: Start FastAPI server
    shell: |
      nohup env FIREBASE_KEY_BASE64='{{ firebase_key }}' \
      {{ app_dir }}/venv/bin/uvicorn app.main:app \
      --host 0.0.0.0 --port 8000 > app.log 2>&1 &
    args:
      chdir: "{{ app_dir }}"
